name: Check sources

# Reports how far the live sources have drifted from the saved copies. It commits
# nothing, because a data change also needs the benchmark rerun and a person's review.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_sources.py
      - run: python scripts/build_dataset.py | tee -a "$GITHUB_STEP_SUMMARY"
